[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nfl-prediction-engine"
version = "5.3.0"
description = "Auditable NFL, NBA and NHL pregame predictions and chronological backtests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.1; python_version < '3.12'",
  "scipy==1.18.1; python_version >= '3.12'",
  "requests==2.34.2",
  "joblib==1.6.0",
  "pyarrow==26.0.0",
  "threadpoolctl==3.7.0",
  "streamlit==1.66.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[project.scripts]
nfl-predict = "predictions.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/predictions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
